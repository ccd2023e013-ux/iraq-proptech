# Base stack — shared by every environment.
#   docker compose up                       → base (production-like images)
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up      → dev (hot reload)
#   docker compose -f docker-compose.yml -f docker-compose.production.yml up -d → production PC
#   add `--profile automation` to also start n8n (optional, never required by the app)

name: proptech

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_JSON: ${LOG_JSON:-true}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-proptech}:${POSTGRES_PASSWORD:-proptech}@db:5432/${POSTGRES_DB:-proptech}
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:-change-me-in-every-environment}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  SMS_PROVIDER: ${SMS_PROVIDER:-mock}
  SMS_GATEWAY_URL: ${SMS_GATEWAY_URL:-}
  SMS_GATEWAY_TOKEN: ${SMS_GATEWAY_TOKEN:-}
  WEBHOOK_ALLOW_HTTP: ${WEBHOOK_ALLOW_HTTP:-false}
  WEBHOOK_ALLOW_PRIVATE_HOSTS: ${WEBHOOK_ALLOW_PRIVATE_HOSTS:-false}
  NOTIFICATIONS_INLINE: ${NOTIFICATIONS_INLINE:-false}
  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-demo}
  PAYMENT_DEMO_IN_PRODUCTION: ${PAYMENT_DEMO_IN_PRODUCTION:-false}
  ANALYTICS_UTC_OFFSET_MINUTES: ${ANALYTICS_UTC_OFFSET_MINUTES:-180}
  WORKER_BEAT: ${WORKER_BEAT:-1}
  AI_PROVIDER: ${AI_PROVIDER:-mock}
  AI_MODEL: ${AI_MODEL:-}
  AI_DAILY_LIMIT_PER_USER: ${AI_DAILY_LIMIT_PER_USER:-100}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
  # Proxies in front of the frontend that append X-Forwarded-For (0 = trust none).
  TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
  COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-mock}
  EMAIL_FROM: ${EMAIL_FROM:-Iraq PropTech <no-reply@iraq-proptech.local>}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  # Media: a named volume shared by API and worker (survives container rebuilds),
  # or any S3-compatible bucket (MinIO, Supabase Storage, R2) with STORAGE_BACKEND=s3.
  STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
  STORAGE_LOCAL_PATH: /app/storage
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
  S3_REGION: ${S3_REGION:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-proptech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-proptech}
      POSTGRES_DB: ${POSTGRES_DB:-proptech}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: ./backend
    command: ["migrate"]
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    command: ["api"]
    environment: *backend-env
    volumes:
      - media:/app/storage
    ports:
      # BACKEND_BIND=127.0.0.1 keeps the API private to the host (production overlay).
      - "${BACKEND_BIND:-0.0.0.0}:${BACKEND_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: ["worker"]
    environment: *backend-env
    volumes:
      - media:/app/storage
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    environment:
      API_INTERNAL_URL: http://backend:8000
      MAP_PROVIDER: ${MAP_PROVIDER:-openfreemap}
      MAP_STYLE_URL: ${MAP_STYLE_URL:-}
      MAP_ATTRIBUTION: ${MAP_ATTRIBUTION:-}
      MAP_DEFAULT_BBOX: ${MAP_DEFAULT_BBOX:-}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    profiles: ["automation"]
    environment:
      GENERIC_TIMEZONE: Asia/Baghdad
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8ndata:/home/node/.n8n

volumes:
  pgdata:
  redisdata:
  media:
  n8ndata:
