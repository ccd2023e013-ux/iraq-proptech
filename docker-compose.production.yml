# Production overrides for the self-hosted PC.
#   docker compose -f docker-compose.yml -f docker-compose.production.yml --env-file .env up -d
# Requires Docker Compose >= 2.24 (`!override`).
# Required in .env: POSTGRES_PASSWORD, JWT_SECRET (>= 32 chars), CORS_ORIGINS and
# FRONTEND_URL (your https origin). The API only listens on 127.0.0.1 (the
# frontend proxies /api/v1/*); put a TLS reverse proxy or tunnel in front of :3000.
# The API refuses to start when `python -m app.cli preflight` reports errors.

services:
  db:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

  redis:
    restart: unless-stopped

  backend:
    restart: unless-stopped
    ports: !override
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    environment:
      APP_ENV: production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      # One TLS reverse proxy / tunnel in front of :3000 (see MIGRATE-TO-LOCAL-PC.md).
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}

  worker:
    restart: unless-stopped
    environment:
      APP_ENV: production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}

  frontend:
    restart: unless-stopped

  n8n:
    restart: unless-stopped
    environment:
      N8N_SECURE_COOKIE: "true"
