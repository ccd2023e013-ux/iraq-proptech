# Production overrides for the self-hosted PC.
#   docker compose -f docker-compose.yml -f docker-compose.production.yml --env-file .env up -d
# Required in .env: POSTGRES_PASSWORD, JWT_SECRET (>= 32 chars). NEXT_PUBLIC_API_URL is optional.

services:
  db:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

  redis:
    restart: unless-stopped

  backend:
    restart: unless-stopped
    environment:
      APP_ENV: production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}

  worker:
    restart: unless-stopped
    environment:
      APP_ENV: production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}

  frontend:
    restart: unless-stopped

  n8n:
    restart: unless-stopped
    environment:
      N8N_SECURE_COOKIE: "true"
