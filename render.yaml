# Render Blueprint — TEMPORARY $0 deployment (see docs/RENDER.md).
# Both services build the same Dockerfiles used on the production PC; nothing
# here is Render-specific code. Database: Supabase (docs/SUPABASE.md).
# Free instances sleep when idle; there is no free background worker, so
# notifications are delivered inline and scheduled jobs are triggered by the
# GitHub Actions workflow .github/workflows/scheduled-jobs.yml.
services:
  - type: web
    name: iraq-proptech-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_JSON
        value: "true"
      - key: RUN_MIGRATIONS          # alembic upgrade head before the API starts
        value: "1"
      - key: DATABASE_URL            # Supabase session pooler URL (IPv4), see SUPABASE.md
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # FRONTEND_URL / CORS_ORIGINS are optional here: the browser talks to the
      # API through the web service's same-origin proxy (no CORS), and email
      # links need FRONTEND_URL only once a real email provider is configured.
      # Measured on the live site (GET /api/v1/admin/system → request_network): a browser
      # request reaches the API with X-Forwarded-For
      #   client, cloudflare, render-internal, web-egress, cloudflare, render-internal
      # (Cloudflare + Render's load balancer on each of the two hops), so the client is
      # the 6th entry from the right. The daily Live site security check verifies this.
      - key: TRUSTED_PROXY_HOPS
        value: "6"
      - key: NOTIFICATIONS_INLINE    # no Celery worker on the free plan
        value: "true"
      - key: JOBS_TRIGGER_TOKEN      # copy into the GitHub secret JOBS_TRIGGER_TOKEN
        generateValue: true
      # Media must not live on the ephemeral container disk: use Supabase Storage (S3 API).
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET               # private Supabase Storage bucket
        value: media
      - key: S3_ENDPOINT_URL         # https://<ref>.supabase.co/storage/v1/s3
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: AI_PROVIDER             # mock = free and offline; real providers need a key
        value: mock
      - key: PAYMENT_PROVIDER
        value: demo
      - key: PAYMENT_DEMO_IN_PRODUCTION   # public demo site: simulated checkout, clearly marked DEMO
        value: "true"
      # Clearly-labelled synthetic Iraqi listings (is_demo) are created/updated in the
      # background at start-up; idempotent. Set to "off" to stop seeding.
      - key: DEMO_SEED
        value: iraq
      # Password for the seeded demo accounts (admin, agency owner, agent, customer).
      # Choose a strong one; keep the same value in the GitHub secret DEMO_ACCOUNT_PASSWORD.
      - key: DEMO_ACCOUNT_PASSWORD
        sync: false
      - key: DB_POOL_SIZE            # Supabase free plan: keep connections low
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "2"

  - type: web
    name: iraq-proptech-web
    runtime: docker
    plan: free
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    # Dependency-free liveness route. "/" renders the home page, which needs the
    # API; while the API is starting, sleeping or migrating, "/" fails and Render
    # marks the web service unhealthy (503 to visitors).
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: API_INTERNAL_URL        # the API service URL, e.g. https://iraq-proptech-api.onrender.com
        sync: false
      - key: MAP_PROVIDER
        value: openfreemap
      - key: MAP_DEFAULT_BBOX
        value: 47.65,30.40,47.95,30.62
