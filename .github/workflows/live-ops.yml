name: Live operations

# Manual operations on the live deployment, using GitHub secrets only:
#   diagnose  which settings are present (never values), password policy, S3 round
#             trip, database contents — read-only except a temporary S3 probe object
#   seed      run the idempotent national DEMO seed against the live database and
#             bucket (needs S3_* secrets; same command the API runs at start-up)
#   import-development  load the curated, source-cited development projects (Future Iraq)
#   import-osm  import real named places for a city from OpenStreetMap (one Overpass
#             request, ODbL attribution kept; idempotent refresh)
on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [diagnose, seed, import-osm, import-development]
        default: diagnose
      s3_endpoint:
        description: "Optional S3 endpoint override (not secret), e.g. https://<ref>.storage.supabase.co/storage/v1/s3"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build the backend image
        run: docker build -q -t proptech-backend backend
      - name: ${{ inputs.action }}
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          DEMO_ACCOUNT_PASSWORD: ${{ secrets.DEMO_ACCOUNT_PASSWORD }}
          S3_ENDPOINT_URL: ${{ inputs.s3_endpoint || secrets.S3_ENDPOINT_URL }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: |
          common=(-e DATABASE_URL -e DEMO_ACCOUNT_PASSWORD -e S3_ENDPOINT_URL -e S3_REGION
                  -e S3_ACCESS_KEY_ID -e S3_SECRET_ACCESS_KEY -e APP_ENV=production
                  -e JWT_SECRET="$(openssl rand -hex 32)" -e PREFLIGHT=0)
          if [ "${{ inputs.action }}" = "seed" ]; then
            [ -n "$S3_ACCESS_KEY_ID" ] || { echo "::error::S3_* secrets are required to seed images"; exit 1; }
            bash scripts/ci/annotate.sh "live seed" docker run --rm "${common[@]}" \
              -e STORAGE_BACKEND=s3 -e S3_BUCKET=media proptech-backend \
              python -m app.cli seed-demo-iraq --allow-production
          elif [ "${{ inputs.action }}" = "import-development" ]; then
            out=$(bash scripts/ci/annotate.sh "live development import" docker run --rm "${common[@]}" \
              proptech-backend python -m app.cli import-development --dataset basra) || { echo "$out"; exit 1; }
            echo "$out"
            echo "::notice title=live development import::$(tail -1 <<<"$out")"
          elif [ "${{ inputs.action }}" = "import-osm" ]; then
            out=$(bash scripts/ci/annotate.sh "live osm import" docker run --rm "${common[@]}" \
              proptech-backend python -m app.cli import-osm-pois --city basra) || { echo "$out"; exit 1; }
            echo "$out"
            echo "::notice title=live osm import::$(tail -1 <<<"$out")"
          else
            bash scripts/ci/annotate.sh "live diagnose" docker run --rm "${common[@]}" \
              -v "$PWD/scripts/live:/live:ro" proptech-backend python /live/diagnose.py
          fi
