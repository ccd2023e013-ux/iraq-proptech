name: Resolve lockfile (temporary)

# TEMPORARY — exists only on deps/maplibre-6 and is deleted right after it has
# run. The development environment cannot reach the npm registry (nor artifact
# storage), so the lockfile for a changed package.json is resolved here, on a
# standard GitHub-hosted runner, and committed back to THIS branch (same pattern
# as ci.yml's lockfile commit on main). No secrets; write access only for this
# job; pushes made with GITHUB_TOKEN do not trigger further workflow runs.

on:
  push:
    branches: ["deps/maplibre-6"]
    paths:
      - ".github/workflows/resolve-lockfile.yml"
      - "frontend/package.json"

permissions: {}

jobs:
  resolve:
    if: github.ref == 'refs/heads/deps/maplibre-6'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # commit package-lock.json to this branch only
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Resolve package-lock.json from package.json
        run: |
          npm --version
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --stat -- package-lock.json
          node -e "const l=require('./package-lock.json');console.log('maplibre-gl', l.packages['node_modules/maplibre-gl'].version)"
      - name: Commit the resolved lockfile to this branch
        run: |
          if git diff --quiet -- package-lock.json; then echo "lockfile already up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(frontend): package-lock.json for maplibre-gl 6 (resolved by CI)"
          git push origin "HEAD:refs/heads/deps/maplibre-6"
