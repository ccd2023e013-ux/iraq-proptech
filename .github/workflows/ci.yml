name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANNOTATE: ${{ github.workspace }}/scripts/ci/annotate.sh

jobs:
  backend:
    name: Backend (lint, types, tests on PostGIS)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: proptech
          POSTGRES_PASSWORD: proptech
          POSTGRES_DB: proptech_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U proptech -d proptech_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://proptech:proptech@localhost:5432/proptech_test
      REDIS_URL: redis://localhost:6379/0
      REQUIRE_DB: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: $ANNOTATE "pip install" pip install -e ".[dev]"
      - name: Ruff (lint + format)
        run: $ANNOTATE "ruff" bash -c 'ruff check . && ruff format --check .'
      - name: Mypy
        run: $ANNOTATE "mypy" mypy app
      - name: Tests
        run: $ANNOTATE "pytest" pytest --cov=app --cov-report=term-missing

  frontend:
    name: Frontend (lint, tests, build, types)
    runs-on: ubuntu-latest
    permissions:
      contents: write  # only used by the one-time lockfile bootstrap step
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install
        run: $ANNOTATE "npm install" bash -c 'if [ -f package-lock.json ]; then npm ci; else npm install; fi'
      - name: Lint
        run: $ANNOTATE "eslint" npm run lint
      - name: Format check
        run: $ANNOTATE "prettier" npm run format:check
      - name: Unit / component tests
        run: $ANNOTATE "vitest" npm test
      - name: Production build
        run: $ANNOTATE "next build" npm run build
      - name: Type check
        run: $ANNOTATE "tsc" npm run typecheck
      # Bootstrap only: this repo was scaffolded without registry access, so the
      # first green run on main commits the resolved lockfile. Once it exists,
      # `npm ci` is used and this step is a no-op.
      - name: Commit generated lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "lockfile already tracked"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(frontend): add package-lock.json generated by CI"
          git push

  stack:
    name: Docker stack smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Build images
        run: $ANNOTATE "docker build" docker compose build
      - name: Start stack
        run: $ANNOTATE "compose up" bash scripts/ci/wait-for-stack.sh
      - name: API readiness (direct)
        run: |
          curl -fsS http://localhost:8000/api/v1/health/ready | tee /tmp/ready.json
          grep -q '"status":"ok"' /tmp/ready.json
      - name: API through the frontend's same-origin proxy
        run: curl -fsS http://localhost:3000/api/v1/health | grep -q '"status":"ok"'
      - name: Frontend renders Arabic RTL page with live status
        run: |
          curl -fsS http://localhost:3000/ -o /tmp/home.html
          grep -q 'dir="rtl"' /tmp/home.html
          grep -q 'lang="ar"' /tmp/home.html
          grep -q 'حالة النظام' /tmp/home.html
      - name: Worker executes a task via Redis
        run: >
          docker compose exec -T backend python -c
          "from app.workers.celery_app import ping; print(ping.delay().get(timeout=60))"
          | grep -q pong
      - name: Logs on failure
        if: failure()
        run: $ANNOTATE "compose logs" bash -c 'docker compose ps -a; docker compose logs --no-color --tail=80; exit 1'
      - name: Tear down
        if: always()
        run: docker compose down -v
