name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, types, tests on PostGIS)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: proptech
          POSTGRES_PASSWORD: proptech
          POSTGRES_DB: proptech_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U proptech -d proptech_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://proptech:proptech@localhost:5432/proptech_test
      REDIS_URL: redis://localhost:6379/0
      REQUIRE_DB: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff (lint + format)
        run: ruff check . && ruff format --check .
      - name: Mypy
        run: mypy app
      - name: Tests
        run: pytest --cov=app --cov-report=term-missing

  frontend:
    name: Frontend (lint, tests, build, types)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Unit / component tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Type check
        run: npm run typecheck
      - name: Upload lockfile (until it is committed)
        if: always() && hashFiles('frontend/package-lock.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: frontend/package-lock.json

  stack:
    name: Docker stack smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Start stack
        run: docker compose up -d --wait --wait-timeout 180 db redis backend worker frontend
      - name: API readiness (direct)
        run: |
          curl -fsS http://localhost:8000/api/v1/health/ready | tee /tmp/ready.json
          grep -q '"status":"ok"' /tmp/ready.json
      - name: API through the frontend's same-origin proxy
        run: curl -fsS http://localhost:3000/api/v1/health | grep -q '"status":"ok"'
      - name: Frontend renders Arabic RTL page with live status
        run: |
          curl -fsS http://localhost:3000/ -o /tmp/home.html
          grep -q 'dir="rtl"' /tmp/home.html
          grep -q 'lang="ar"' /tmp/home.html
          grep -q 'حالة النظام' /tmp/home.html
      - name: Worker executes a task via Redis
        run: >
          docker compose exec -T backend python -c
          "from app.workers.celery_app import ping; print(ping.delay().get(timeout=60))"
          | grep -q pong
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v
