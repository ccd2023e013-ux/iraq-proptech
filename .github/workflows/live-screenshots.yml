name: Live screenshots

# Design review: screenshots of the deployed site pushed to a new branch
# screenshots/run-<id> (never to main).
on:
  workflow_dispatch:
    inputs:
      pages:
        description: "|-separated paths (default set when empty)"
        required: false
        default: ""

permissions: {}

jobs:
  shoot:
    # Demo-account secrets: only code on main may run with them.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # pushes the screenshots/run-<id> branch
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Playwright + Chromium
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -qq fonts-noto-core fonts-noto-ui-core >/dev/null || true
      - name: Screenshots
        env:
          DEMO_ACCOUNT_PASSWORD: ${{ secrets.DEMO_ACCOUNT_PASSWORD }}
          DEMO_ADMIN_PASSWORD: ${{ secrets.DEMO_ADMIN_PASSWORD }}
          PAGES_INPUT: ${{ inputs.pages }}
        run: |
          . deploy/live.env
          [ -n "$PAGES_INPUT" ] && export PAGES="$PAGES_INPUT"
          curl -fsS -o /dev/null --retry 8 --retry-delay 15 --retry-all-errors --max-time 120 "$LIVE_WEB_URL/healthz"
          curl -fsS -o /dev/null --retry 8 --retry-delay 15 --retry-all-errors --max-time 120 "$LIVE_API_URL/api/v1/health"
          WEB_URL="$LIVE_WEB_URL" bash scripts/ci/annotate.sh "screenshots" python scripts/live/screenshots.py
      - name: Push to a screenshots branch
        run: |
          set -x
          branch="screenshots/run-${{ github.run_id }}"
          mkdir -p /tmp/out && cp shots/* /tmp/out/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan "$branch"
          git rm -rf -q . >/dev/null
          cp /tmp/out/* .
          git add *.jpg
          git commit -q -m "screenshots ${{ github.run_id }}"
          git push -q origin "$branch"
          echo "::notice title=screenshots summary::branch $branch ($(ls /tmp/out | wc -l) images)"
